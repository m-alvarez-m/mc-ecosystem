# CI del monorepo: cada push a main compila y testea los 5 subproyectos
# activos. Cualquier fallo marca el commit en rojo en GitHub y bloquea
# la lectura "todo verde" del branch principal.
#
# Alcance (FASE A.1 del roadmap-consolidacion-v1.2-v2.0.md, ticket P2-4):
#   - plugin  (Gradle: build + MockBukkit tests)     ← ya existia
#   - eventfx (Gradle: build + tests)                ← ya existia
#   - api     (npm ci + typecheck + test)
#   - bot     (npm ci + typecheck + test)
#   - genesis (npm ci + typecheck + test)
#
# Trigger `push: main` explicito (no PRs, no branches secundarios). El
# proyecto opera sobre `main` linealmente; ampliar a PRs es one-liner
# cuando se adopte flujo de branches.

name: CI

on:
  push:
    branches: [main]

jobs:
  plugin:
    name: Plugin (gradlew build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v7

      # El toolchain de Gradle exige Java 25 (Paper 26.2); Temurin, como en dev.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      # Cachea dependencias y el wrapper entre ejecuciones.
      - uses: gradle/actions/setup-gradle@v6

      - name: Build y tests
        run: ./gradlew build

  eventfx:
    name: EventFX (gradlew build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eventfx
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build y tests
        run: ./gradlew build

  api:
    name: API (npm ci + typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: api/package-lock.json

      # `ci` (no `install`): respeta package-lock.json exacto o falla.
      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Test (vitest run)
        run: npm test

  bot:
    name: Bot Pulso (npm ci + typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Test (vitest run)
        run: npm test

  genesis:
    name: Genesis Dashboard (npm ci + typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: genesis
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: genesis/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck (tsc -b --noEmit)
        run: npm run typecheck

      - name: Test (vitest run)
        run: npm test
