services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: "mc"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "mc_ecosystem"
    ports:
      - "5432:5432"
    volumes:
      - ./pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mc -d mc_ecosystem"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
