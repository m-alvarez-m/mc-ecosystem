services:
  api:
    build: ../api
    environment:
      # La API SIEMPRE como mc_app (append-only); "postgres" es el
      # nombre del servicio vecino en la red interna de compose.
      DATABASE_URL: "postgresql://mc_app:${MC_APP_PASSWORD}@postgres:5432/mc_ecosystem"
      # ADR-012 · Retención de events. mc_pruner es un rol separado con
      # SELECT+DELETE sobre events (mc_app conserva su REVOKE DELETE).
      # Si MC_PRUNER_PASSWORD no está en infra/.env, esta URL sigue
      # renderizándose pero el módulo de prune fallará al arrancar —
      # deliberado (ver src/prune/db.ts).
      DATABASE_URL_PRUNE: "postgresql://mc_pruner:${MC_PRUNER_PASSWORD}@postgres:5432/mc_ecosystem"
      # ADR-012 D5: dry-run ON por defecto operacional. El código de
      # archivado se ejercita mensualmente pero NO sube nada a B2 ni
      # borra filas hasta que el dueño flippee esto a "false".
      EVENTS_PRUNE_DRY_RUN: "${EVENTS_PRUNE_DRY_RUN:-true}"
      EVENTS_RETENTION_MONTHS: "${EVENTS_RETENTION_MONTHS:-24}"
      # ADR-012 D3: endpoint POST /admin/events/prune. Sin token → 503.
      ADMIN_PRUNE_TOKEN: "${ADMIN_PRUNE_TOKEN:-}"
      # Credenciales de B2 (mismas que backup). Bucket y prefijo del
      # ADR-012 D2. Si están vacías, el módulo funciona igual en
      # dry-run pero un intento real falla explícitamente.
      B2_ACCOUNT_ID: "${B2_ACCOUNT_ID:-}"
      B2_ACCOUNT_KEY: "${B2_ACCOUNT_KEY:-}"
      B2_BUCKET: "${B2_BUCKET:-mc-ecosystem-backups}"
      B2_ARCHIVE_PREFIX: "${B2_ARCHIVE_PREFIX:-archive/events}"
    volumes:
      # Resource pack del Modo Evento, servido en GET /pack.zip.
      - ./resourcepack:/app/resourcepack:ro
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backup:
    build: ./backup
    environment:
      # Dos líneas de defensa: repo local (rápido, primera línea) y B2
      # (resguardo externo). Cada backup local se copia a B2 con restic copy.
      RESTIC_REPOSITORY: "/repo"
      # RESTIC_OFFSITE: default apunta al repo raíz del bucket B2 (uso de
      # staging, histórico). Prod pone un sub-repo distinto en el MISMO
      # bucket (b2:mc-ecosystem-backups:world-real), aislado por restic:
      # snapshots de prod nunca se cruzan con los de staging.
      RESTIC_REPOSITORY_OFFSITE: "${RESTIC_OFFSITE:-b2:mc-ecosystem-backups}"
      RESTIC_PASSWORD: "${RESTIC_PASSWORD}"
      B2_ACCOUNT_ID: "${B2_ACCOUNT_ID}"
      B2_ACCOUNT_KEY: "${B2_ACCOUNT_KEY}"
      PGHOST: "postgres"
      PGUSER: "mc"
      PGPASSWORD: "${POSTGRES_PASSWORD}"
      PGDATABASE: "mc_ecosystem"
      EVENTS_API_URL: "http://api:3000/events"
      # rcon del servidor activo para save-off/save-on durante el backup
      # del mundo. En staging: minecraft-staging (default). En prod: se
      # sobreescribe con RCON_HOST=minecraft-prod en .env.
      RCON_HOST: "${RCON_HOST:-minecraft-staging}"
      RCON_PASSWORD: "${RCON_PASSWORD}"
    volumes:
      # Repo local restic. Se separa por modo (backup-repo/ para staging,
      # backup-repo-prod/ para prod) porque el chain de restic snapshots no
      # se puede mezclar sin corromper la retención.
      - ${BACKUP_REPO:-./backup-repo}:/repo
      # Mundo del servidor activo, read-only: el backup JAMÁS toca el
      # mundo. En staging: bind local ./staging-data. En prod: ruta
      # absoluta al mundo real, se pone en WORLD_MOUNT del .env.
      # (El path de contenedor sigue siendo /data/staging por compat con
      # backup.sh, que hace glob /data/staging/world*.)
      - ${WORLD_MOUNT:-./staging-data}:/data/staging:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  bot:
    build: ../bot
    # Discord bot Pulso: consumidor read-only del Event Store, publica
    # crónicas en Discord. Vive aquí junto al api porque ambos son
    # servicios de aplicación TS que forman parte del stack productivo
    # (se levantan via -f docker-compose.dev.yml -f docker-compose.prod.yml).
    env_file:
      # Fuente de verdad de los secretos y config del bot. Sigue el
      # patrón "cada aplicación mantiene su propio .env"; el compose
      # NO migra nada a infra/.env.
      - ../bot/.env
    environment:
      # Overrides del contexto Docker. bot/.env tiene defaults locales
      # (http://localhost:3000, ./data/cursor.json, PORT=3000) que no
      # sirven dentro del compose: aquí resolvemos por nombre de servicio
      # y por la ruta del volumen. No hay secretos aquí — sólo cableado
      # de red y filesystem del contenedor.
      API_BASE_URL: "http://api:3000"
      CURSOR_FILE: "/app/data/cursor.json"
      PORT: "3001"
    volumes:
      # Datos persistentes del bot (cursor y todo lo que venga en el
      # futuro: cache, snapshots, wrapped, exports). Bind mount al
      # patrón del proyecto (./pg-data, ./backup-repo, ./staging-data).
      - ./bot-data:/app/data
    depends_on:
      # El bot arranca su polling contra el api en el primer tick; sin
      # que el api esté healthy, la primera iteración fallaría.
      api:
        condition: service_healthy
    healthcheck:
      # Mismo mecanismo que el api (Node 24 trae fetch nativo). El bot
      # reporta 200 cuando el cliente Discord está ready; 503 mientras
      # se conecta. `interval: 10s` + `retries: 5` da ~50s de gracia
      # para el login inicial (más que suficiente en la práctica).
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    # PID 1 real (docker-init/tini): reap de hijos zombies + forward
    # ordenado de SIGINT/SIGTERM a Node. Sin esto, `docker stop`
    # espera los 10s por defecto y luego SIGKILL, cortando el logout
    # de discord.js a mitad. Opción oficial del compose spec (v2+);
    # sin instalar tini en la imagen ni cambiar el ENTRYPOINT.
    init: true
    # Rotación acotada de logs del contenedor (json-file driver por
    # defecto de Docker Desktop). El bot produce ~1 línea/s de polling
    # + picos cortos de handlers; con 10 MB × 5 archivos hay techo
    # duro de ~50 MB por servicio en disco del host, evita crecimiento
    # ilimitado en Windows sin logrotate del sistema.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

  genesis:
    # Dashboard Genesis (D1 · foundation). SPA React + Vite compilada
    # y servida por nginx:alpine dentro de este contenedor. El mismo
    # nginx hace reverse-proxy /api/* -> http://api:3000/* para que el
    # navegador vea un unico origen (sin CORS en la API).
    #
    # Solo esta declarado en docker-compose.dev.yml — la exposicion en
    # produccion queda para cuando exista autenticacion (ver auditoria
    # D1 §10).
    build: ../genesis
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # nginx.conf expone GET /health -> "ok". Usa wget (nginx:alpine
      # no trae curl) contra 127.0.0.1 explicito: BusyBox wget no
      # resuelve `localhost` en todas las variantes de la imagen.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: "mc"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "mc_ecosystem"
    ports:
      - "5432:5432"
    volumes:
      - ./pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mc -d mc_ecosystem"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
