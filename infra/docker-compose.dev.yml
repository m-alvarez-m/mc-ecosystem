services:
  api:
    build: ../api
    environment:
      # La API SIEMPRE como mc_app (append-only); "postgres" es el
      # nombre del servicio vecino en la red interna de compose.
      DATABASE_URL: "postgresql://mc_app:${MC_APP_PASSWORD}@postgres:5432/mc_ecosystem"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backup:
    build: ./backup
    environment:
      # Dos líneas de defensa: repo local (rápido, primera línea) y B2
      # (resguardo externo). Cada backup local se copia a B2 con restic copy.
      RESTIC_REPOSITORY: "/repo"
      RESTIC_REPOSITORY_OFFSITE: "b2:mc-ecosystem-backups"
      RESTIC_PASSWORD: "${RESTIC_PASSWORD}"
      B2_ACCOUNT_ID: "${B2_ACCOUNT_ID}"
      B2_ACCOUNT_KEY: "${B2_ACCOUNT_KEY}"
      PGHOST: "postgres"
      PGUSER: "mc"
      PGPASSWORD: "${POSTGRES_PASSWORD}"
      PGDATABASE: "mc_ecosystem"
      EVENTS_API_URL: "http://api:3000/events"
      # rcon del staging para save-off/save-on durante el backup del mundo.
      RCON_HOST: "minecraft-staging"
      RCON_PASSWORD: "${RCON_PASSWORD}"
    volumes:
      - ./backup-repo:/repo
      # Read-only: el backup jamás puede tocar el mundo.
      - ./staging-data:/data/staging:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: "mc"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "mc_ecosystem"
    ports:
      - "5432:5432"
    volumes:
      - ./pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mc -d mc_ecosystem"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
