services:
  minecraft-staging:
    image: itzg/minecraft-server
    environment:
      TYPE: "PAPER"
      VERSION: "26.2"
      EULA: "TRUE"
      MEMORY: "4G"
      ONLINE_MODE: "TRUE"
      MOTD: "STAGING LOCAL - desechable"
      # La API vive en la misma red de compose: se resuelve por nombre de servicio.
      EVENTS_API_URL: "http://api:3000/events"
    ports:
      - "25565:25565"
    volumes:
      - ./staging-data:/data
    stdin_open: true
    tty: true
    restart: unless-stopped
