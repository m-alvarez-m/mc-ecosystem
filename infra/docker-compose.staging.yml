services:
  minecraft-staging:
    image: itzg/minecraft-server
    environment:
      TYPE: "PAPER"
      # 26.1.2 (no 26.2): CoreProtect 24.0 tiene chequeo duro de versión y
      # rechaza 26.2. Es además la versión de la suite de tests del plugin.
      VERSION: "26.1.2"
      EULA: "TRUE"
      MEMORY: "4G"
      # ADR-001: modo offline. La identidad pasa a ser el NOMBRE (UUID offline
      # derivado de él) y la autenticación la pone AuthMe. Whitelist SIEMPRE.
      ONLINE_MODE: "FALSE"
      ENABLE_WHITELIST: "TRUE"
      ENFORCE_WHITELIST: "TRUE"
      # SIN env WHITELIST: el sincronizador resuelve nombres contra Mojang
      # (UUIDs premium), incompatible con modo offline. La whitelist vive en
      # whitelist.json del volumen y se gestiona por rcon (ver runbook).
      # Plugins gestionados por el propio contenedor (versionado = compose).
      # URLs directas: Spiget no sirve a AuthMe (alojado fuera) y el filtro
      # de Modrinth rechaza CoreProtect 24.0 para 26.2 (publica hasta 26.1.2,
      # API-compatible, mismo caso que MockBukkit en el plugin).
      PLUGINS: |
        https://github.com/AuthMe/AuthMeReloaded/releases/download/6.0.0/AuthMe-6.0.0-Paper.jar
        https://cdn.modrinth.com/data/Lu3KuzdV/versions/Kma0kBsY/CoreProtect-CE-24.0.jar
        https://github.com/SkinsRestorer/SkinsRestorer/releases/download/15.12.4/SkinsRestorer.jar
        https://github.com/retrooper/packetevents/releases/download/v2.13.0/packetevents-spigot-2.13.0.jar
      # Configs de plugins versionadas en infra/configs/, copiadas a /data.
      COPY_CONFIG_DEST: "/data"
      SYNC_SKIP_NEWER_IN_DESTINATION: "false"
      # Password fija para que el servicio backup pueda hacer save-off/on.
      RCON_PASSWORD: "${RCON_PASSWORD}"
      # Resource pack del Modo Evento: URL PUBLICA desde la que los CLIENTES
      # lo descargan (el servicio packserver via un segundo tunel de playit;
      # ver runbook). El SHA1 hace que el cliente re-descargue solo cuando el
      # pack cambia de version.
      RESOURCE_PACK: "${RESOURCE_PACK_URL:-}"
      RESOURCE_PACK_SHA1: "${RESOURCE_PACK_SHA1:-}"
      MOTD: "STAGING LOCAL - desechable"
      # La API vive en la misma red de compose: se resuelve por nombre de servicio.
      EVENTS_API_URL: "http://api:3000/events"
    ports:
      - "25565:25565"
    volumes:
      - ./staging-data:/data
      - ./configs:/config:ro
    stdin_open: true
    tty: true
    restart: unless-stopped

  # Servidor estático dedicado SOLO para el resource pack. Se expone
  # publicamente (segundo tunel de playit) en vez de tunelizar la API:
  # asi el mundo ve UNICAMENTE pack.zip (solo lectura) y jamas el endpoint
  # POST /events (que quedaria abierto a inyeccion de eventos falsos).
  packserver:
    image: nginx:alpine
    volumes:
      # Directorio (no archivo) para que al regenerar pack.zip el mount
      # refleje el nuevo contenido sin recrear el contenedor.
      - ./resourcepack:/usr/share/nginx/html:ro
    restart: unless-stopped

  # Quick tunnel de Cloudflare: da una URL publica HTTPS al packserver sin
  # cuenta, sin token y sin dominio. LIMITACION CLAVE: la URL es EFIMERA -
  # cambia en cada arranque del contenedor. Por eso NO se levanta este
  # compose a mano: usar infra/publish-pack-url.sh, que espera la URL, la
  # verifica y recien entonces arranca Minecraft (ver runbook).
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://packserver:80
    depends_on:
      - packserver
    restart: unless-stopped

  # Túnel público de playit.gg: expone el servidor a internet sin abrir
  # puertos en el router. El agente alcanza a los servicios por la red
  # interna (minecraft-staging:25565, packserver:80); túneles en el dashboard.
  playit:
    image: ghcr.io/playit-cloud/playit-agent:1.0.10
    environment:
      # Secreto del agente: se crea en el dashboard de playit.gg (Agents →
      # New Agent → Docker) y vive en infra/.env como PLAYIT_SECRET_KEY.
      SECRET_KEY: "${PLAYIT_SECRET_KEY}"
    depends_on:
      - minecraft-staging
      - packserver
    restart: unless-stopped
