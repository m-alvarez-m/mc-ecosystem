# EventFX - config versionada (se sincroniza al staging en cada arranque).
# Solo ASCII: los acentos ya nos costaron un YAML corrupto (0x81).

# Duracion de los buffs y del evento, en segundos.
duration_seconds: 300

# Sonido del PODER MAXIMO (id vanilla imponente por ahora).
start_sound: "minecraft:entity.wither.spawn"

# Sonido del EL PODER SE DESVANECE (beacon apagandose).
end_sound: "minecraft:block.beacon.deactivate"

# Banda sonora del evento (resource pack propio, infra/resourcepack/).
music_sound: "mcecosystem:evento.musica"
music_loop_seconds: 0

# Rafagas automaticas del evento: velocidad ultra y salto celestial
# (el salto SIEMPRE con inmunidad mas larga que el vuelo).
# Techos del motor: speed ~100; jump ~25 (mas alto y no despegas).
bursts:
  enabled: true
  max_count: 5
  interval_seconds: 50
  speed_level: 100
  speed_seconds: 12
  jump_level: 25
  jump_seconds: 10
  immunity_seconds: 60

# Haunting: apariciones y sonidos falsos SOLO para jugadores en soledad.
# /haunt on|off (persistente). La compania y las reglas de no-crueldad
# PAUSAN los relojes, no los resetean.
# REGLA DE ORO: los rangos de spawn deben ser SIEMPRE mayores que
# close_despawn_distance (aprendido en vivo: nacer dentro del radio de
# huida = duracion 0).
haunting:
  # Jugadores que JAMAS reciben sustos (el titiritero, streamers, etc.)
  exempt:
    - Vancorbus
  solitude_radius: 40
  # Reglas de no-crueldad.
  min_session_minutes: 10
  death_grace_minutes: 20
  combat_grace_seconds: 15
  min_health_hearts: 6
  max_per_session: 2
  appearance:
    interval_minutes: 120
    jitter_minutes: 30
    duration_seconds: 6
    close_despawn_distance: 15
    center_grace_seconds: 2
    # De dia se ve de lejos; de noche (o tormenta) se acerca.
    day_min_distance: 35
    day_max_distance: 50
    night_min_distance: 15
    night_max_distance: 25
    min_angle_separation: 40
    view_cone_degrees: 35
    # Sonido al materializarse, desde la posicion del fantasma ("" = mudo).
    # PENDIENTE: id del resource pack cuando llegue el audio del usuario
    # (sera mcecosystem:haunt.cue).
    sound: ""
  turnaround:
    max_per_night: 1
    interval_minutes: 90
    jitter_minutes: 40
    turn_window_seconds: 4
    duration_min_seconds: 1
    duration_max_seconds: 2
  sounds:
    interval_min_minutes: 20
    interval_max_minutes: 40
    volume: 0.4
    pool:
      - "minecraft:ambient.cave"
      - "minecraft:entity.zombie.ambient"
      - "minecraft:block.gravel.step"
      - "minecraft:block.stone.step"
    # En tormenta la lluvia entierra los pasos: pool alterno sin pasos y
    # volumen amplificado.
    storm_pool:
      - "minecraft:ambient.cave"
      - "minecraft:entity.zombie.ambient"
    storm_volume_multiplier: 1.8
  skin_pool:
    - "https://s.namemc.com/i/650ce4b9af830e29.png"

# Pool de skins del Modo Evento (anime): URLs de textura oficiales.
# Aleatorias y DISTINTAS: minimo tantas entradas como jugadores online.
