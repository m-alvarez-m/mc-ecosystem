# EventFX — config versionada (se sincroniza al staging en cada arranque).

# Duración de los buffs y del evento, en segundos.
duration_seconds: 300

# Sonido del ¡PODER MÁXIMO! (id vanilla imponente por ahora).
# Cuando exista el resource pack propio, reemplazar por su id custom,
# p. ej. "mc-ecosystem:evento.poder_maximo".
start_sound: "minecraft:entity.wither.spawn"

# Sonido del EL PODER SE DESVANECE... (el beacon apagándose queda perfecto).
end_sound: "minecraft:block.beacon.deactivate"

# Banda sonora del evento: sonido del resource pack propio
# (infra/resourcepack/). Suena en el canal MUSIC desde el ¡PODER MÁXIMO!
# y se corta en seco al terminar. Vacío = sin música.
music_sound: "mcecosystem:evento.musica"
# Si la canción es más corta que el evento, relanzarla cada N segundos
# (= duración de la canción). 0 = sonar una sola vez.
music_loop_seconds: 0

# Ráfagas automáticas durante el evento: mini-picos de poder para TODOS
# los participantes, alternando velocidad ultra y salto celestial.
# El salto SIEMPRE va con inmunidad total (Resistance V) más larga que el
# salto: la caída continúa después de que el efecto expira.
# Techos del motor: speed_level máx ~100; jump_level máx útil ~25 (más
# alto rompe la física del salto y no despegas).
bursts:
  enabled: true
  # Cinco picos durante 300 s: 55, 105, 155, 205 y 255 s desde el comando.
  # Evita una sexta rafaga justo al cerrar el evento.
  max_count: 5
  interval_seconds: 50
  speed_level: 100
  speed_seconds: 12
  jump_level: 25
  jump_seconds: 10
  immunity_seconds: 60

# Haunting: apariciones fantasma y sonidos falsos SOLO para jugadores en
# soledad. Se controla con /haunt on|off (persistente entre reinicios).
# Los relojes solo corren en soledad elegible; la compañía los pausa.
haunting:
  # Jugadores que JAMÁS reciben sustos (el titiritero, streamers, etc.)
  exempt:
    - Vancorbus
  solitude_radius: 40
  # Reglas de no-crueldad.
  min_session_minutes: 10
  death_grace_minutes: 20
  combat_grace_seconds: 15
  min_health_hearts: 6
  max_per_session: 2
  appearance:
    interval_minutes: 120
    jitter_minutes: 30
    duration_seconds: 6
    close_despawn_distance: 15
    center_grace_seconds: 2
    # De día se ve de lejos; de noche (o tormenta) se acerca.
    day_min_distance: 35
    day_max_distance: 50
    night_min_distance: 15
    night_max_distance: 25
    min_angle_separation: 40
    view_cone_degrees: 35
  turnaround:
    max_per_night: 1
    interval_minutes: 90
    jitter_minutes: 40
    turn_window_seconds: 4
    duration_min_seconds: 1
    duration_max_seconds: 2
  sounds:
    interval_min_minutes: 20
    interval_max_minutes: 40
    volume: 0.4
    pool:
      - "minecraft:ambient.cave"
      - "minecraft:entity.zombie.ambient"
      - "minecraft:block.gravel.step"
      - "minecraft:block.stone.step"
  # Pool de skins del fantasma (URL de textura o nombre premium).
  # PENDIENTE: reemplazar por la URL real de la skin de Herobrine.
  skin_pool:
    - "PENDIENTE-URL-HEROBRINE"

# Pool de skins del evento (personajes de anime): URLs de textura oficiales.
# Se asignan ALEATORIAS y DISTINTAS: debe haber al menos tantas entradas
# como jugadores conectados al iniciar. La primera vez que se usa cada URL,
# SkinsRestorer la genera vía MineSkin (tarda unos segundos); luego queda
# cacheada.
skin_pool:
  - "http://textures.minecraft.net/texture/11f643eca64809a927d476812c0d8a9221a71de141b20d5999fc7797e0b659ed"
  - "http://textures.minecraft.net/texture/fc745aff11af7f77c58ab12d07d415aa9c04041f632edf03275f19f48b64d4c4"
  - "http://textures.minecraft.net/texture/2c7f5c019d62f1515b0ecc53a63acbc725199bdc4de93338a224249ffc0fc224"
  - "http://textures.minecraft.net/texture/5278def844f507fcec2e530ea50cb69496a87dfe4f1b7c2a2fcff91894bcfced"
  - "http://textures.minecraft.net/texture/43c9af51fe4e9a373f99a35d9b03e2e98cd9056fa6bfaa92e15c81a61ff32b98"
  - "http://textures.minecraft.net/texture/4aeb083fd5c7b70244a30b7922b22aeadf24a4b60028f3341d7b5321d5e59b84"
  - "http://textures.minecraft.net/texture/27d37d68b4841807402b3238107668523d47c626f3dd4ca42e7a5c1721758737"
