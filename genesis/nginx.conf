# nginx runtime config para Genesis (D1).
#
# El contenedor sirve la SPA compilada en /usr/share/nginx/html y hace
# reverse-proxy de /api/* al servicio `api` de la red compose.
#
# El navegador ve un unico origen → no hace falta CORS en la API.
# Ver docs/pulso-bot-design.md · principios de consumidores del Event
# Store: la superficie sigue siendo HTTP contra la api (ADR-009).

server {
    listen       80;
    server_name  _;

    # Logs a stdout/stderr (patron docker).
    access_log   /var/log/nginx/access.log;
    error_log    /var/log/nginx/error.log warn;

    root         /usr/share/nginx/html;
    index        index.html;

    # Reverse-proxy /api/* -> http://api:3000/*
    #
    # trailing slash en ambos lados: /api/foo -> http://api:3000/foo
    # (nginx elimina el prefijo /api antes de reenviar).
    location /api/ {
        proxy_pass         http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Sin buffering: la API es de baja latencia y responses son
        # JSON pequenos; passthrough directo es lo mas simple.
        proxy_buffering    off;

        # Timeouts moderados. Si la API tarda mas de 30s, algo esta
        # mal y preferimos fallar rapido que colgar al navegador.
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    # Salud del proxy en si (util para docker healthcheck futuro).
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # SPA fallback: cualquier ruta que no matchee un archivo real cae
    # al index.html (React Router se encarga en cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agresivo para assets versionados por Vite (hash en el
    # nombre). El index.html NO se cachea — asi los deploys se ven
    # inmediatamente en el navegador.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
